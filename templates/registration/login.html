{% extends "books/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Library Login</h2>
        <p class="text-muted">Sign in with your library administrator account.</p>
        <form method="post">
          {% csrf_token %}
          {% if form.errors %}<div class="alert alert-danger">Username or password is incorrect.</div>{% endif %}
          <div class="mb-3"><label class="form-label" for="id_username">Username</label>{{ form.username }}</div>
          <div class="mb-3"><label class="form-label" for="id_password">Password</label>{{ form.password }}</div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
