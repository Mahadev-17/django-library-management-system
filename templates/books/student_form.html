{% extends "books/base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h2">{{ page_title }}</h1><a class="btn btn-outline-secondary" href="{% url 'student_list' %}">Back</a></div>
<div class="card"><div class="card-body p-4"><form method="post">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary" type="submit">Save Student</button></form></div></div>
</div></div>
{% endblock %}
